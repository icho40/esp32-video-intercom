<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tür – Partei 3</title>
<style>
  :root{
    color-scheme:light;
    --bg:#f4f6fa;
    --fg:#1a1f2d;
    --mut:#6b7080;
    --card:#ffffff;
    --border:#cfd5e3;
    --accent:#0059cc;
    --accent-bg:#e8f1ff;
    --danger:#c62828;
    --danger-bg:#ffe8e8;
    --surface:#eef1f8;
    --btn-bg:#ffffff;
    --btn-border:#cfd5e3;
    --btn-hover:#f3f5fa;
    --btn-active:#e8eefc;
    --ok:#0a8a4b;
    --ok-bg:#e6f6ec;
    --warn:#a66900;
    --warn-bg:#fff3d6;
    --err:#c62828;
    --err-bg:#ffe8e8;
  }

  *{
    box-sizing:border-box;
    -webkit-tap-highlight-color:rgba(0,0,0,0);
  }

  body{
    background:var(--bg);
    color:var(--fg);
    font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    margin:0;
    min-height:100vh;
    display:flex;
    flex-direction:column;
  }

  /* Gesamtes Layout:
     - oben Video-Karte
     - unten Steuerleiste wie eine Call-Bar
  */
  .wrap{
    flex:1;
    min-height:0;
    display:flex;
    flex-direction:column;
    padding:1rem;
    gap:1rem;
  }

    .videoCard{
    flex:1;
    min-height:0;
    position:relative;
    overflow:hidden;
    background:#dfe3ef;
    border:1px solid var(--border);
    border-radius:1rem;
    box-shadow:
      0 30px 80px rgba(0,0,0,.07),
      0 4px 12px rgba(0,0,0,.05);
  }

  /* Video-Bereich */
  /* Overlays innerh. des Bildbereichs */
  .ov{
    position:absolute;
    left:.75rem;
    bottom:.75rem;
    background:rgba(255,255,255,.7);
    backdrop-filter:blur(4px);
    -webkit-backdrop-filter:blur(4px);
    color:var(--fg);
    font-size:.8rem;
    line-height:1.3;
    padding:.4rem .6rem;
    border-radius:.5rem;
    border:1px solid rgba(0,0,0,.08);
    box-shadow:0 4px 16px rgba(0,0,0,.08);
    opacity:0;
    transition:opacity .25s;
  }
.videoCard > img{
  position:absolute;
  left:50%;
  top:50%;
  width:85vh;
  height:auto;
  max-width:none;
  max-height:none;
  object-fit:contain;
  transform:translate(-50%,-50%) rotate(90deg);
}

  .statusBox{
    position:absolute;
    right:.75rem;
    top:.75rem;
    display:flex;
    flex-direction:column;
    align-items:flex-end;
    gap:.4rem;
  }

  .chipParty{
    background:var(--accent-bg);
    color:var(--accent);
    border:1px solid rgba(0,89,204,.4);
    font-size:.75rem;
    font-weight:600;
    padding:.35rem .5rem;
    border-radius:.5rem;
    box-shadow:0 4px 12px rgba(0,0,0,.08);
  }

  .chipState{
    font-size:.75rem;
    font-weight:500;
    border-radius:.5rem;
    padding:.35rem .5rem;
    border:1px solid transparent;
    box-shadow:0 4px 12px rgba(0,0,0,.08);
  }

  .chip-ok{
    color:var(--ok);
    background:var(--ok-bg);
    border-color:rgba(10,138,75,.4);
  }

  .chip-warn{
    color:var(--warn);
    background:var(--warn-bg);
    border-color:rgba(166,105,0,.4);
  }

  .chip-err{
    color:var(--err);
    background:var(--err-bg);
    border-color:rgba(198,40,40,.4);
  }

  .btn{
    background:var(--btn-bg);
    border:1px solid var(--btn-border);
    border-radius:.8rem;
    font-size:.9rem;
    font-weight:600;
    line-height:1.3;
    padding:.8rem 1rem;
    min-width:5.2rem;
    text-align:center;
    color:var(--fg);
    cursor:pointer;
    box-shadow:0 3px 6px rgba(0,0,0,.05);
    user-select:none;
    touch-action:manipulation;
  }
  .btn:active{
    background:var(--btn-active);
  }
  .btn:hover{
    background:var(--btn-hover);
  }

  .btnPrimary{
    background:var(--accent);
    border-color:var(--accent);
    color:#fff;
    box-shadow:0 8px 20px rgba(0,89,204,.35);
  }
  .btnPrimary:hover{
    background:var(--accent);
    filter:brightness(1.07);
  }
  .btnPrimary:active{
    filter:brightness(.95);
  }

  .btnDanger{
    background:var(--danger-bg);
    border-color:var(--danger);
    color:var(--danger);
    box-shadow:0 8px 20px rgba(198,40,40,.15);
  }
  .btnDanger.active{
    background:var(--danger);
    border-color:var(--danger);
    color:#fff;
    box-shadow:0 8px 20px rgba(198,40,40,.35);
  }

  @media(min-width:768px){
    body{font-size:17px;}
    .btn{font-size:.9rem;padding:.9rem 1.1rem;}
  }

  /* Sprechen-Button links neben dem Kamerabild */
.sideTalk{
  position:absolute;
  left:1.5rem;
  top:50%;
  transform:translateY(-50%);
  z-index:10;

  width:160px;
  height:160px;

  background-image:url('/sprechen.png');
  background-size:contain;
  background-position:center;
  background-repeat:no-repeat;
  background-color:transparent;

  border:none;
  padding:0;
  font-size:0;
  min-width:0;

  box-shadow:none;
}
.sideTalk,
.sideTalk:hover,
.sideTalk:active,
.sideTalk.active,
.sideTalk.danger,
.sideTalk.btnDanger,
.sideTalk.btnDanger.active{
  background-color:transparent !important;
  background-size:contain !important;
  background-position:center !important;
  background-repeat:no-repeat !important;

  border:none !important;
  box-shadow:none !important;
  padding:0 !important;

  width:160px !important;
  height:160px !important;
  min-width:160px !important;
  min-height:160px !important;
}
</style>
</head>
<body>

<div class="wrap">
  <!-- Kamera-Karte -->
  <section class="videoCard">
    <img id="img" src="/stream" alt="Live P1" referrerpolicy="no-referrer">

    <button class="btn btnDanger sideTalk" id="btnTalk">🎤 Sprechen</button>

    <div class="ov" id="ov">Verbinden…</div>

    <div class="statusBox">
      <div class="chipParty">Partei&nbsp;3</div>
      <div class="chipState chip-warn" id="stChip">Verbinden…</div>
    </div>
  </section>
</div>

<script>
(()=> {
  // ==== PARTY SETUP ====
  const party = 3;                 // in p2 -> 2, in p3 -> 3
  const BASE  = `/p${party}`;      // "/p1", "/p2", "/p3"

  // ==== ELEMENTS ====
  const img = document.getElementById('img');
  const ov  = document.getElementById('ov');
  const st  = document.getElementById('stChip');
  const btnTalk   = document.getElementById('btnTalk');

  // Klingeln wurde angezeigt -> Server "ack"
  fetch(`/api/call/ack`, {
    method:"POST",
    headers:{"Content-Type":"application/x-www-form-urlencoded"},
    body:`party=${party}`
  }).catch(()=>{});

  let talking = false;

  function setOV(t){
    ov.textContent=t;
    ov.style.opacity=1;
    clearTimeout(ov._t);
    ov._t=setTimeout(()=>ov.style.opacity=.0,900);
  }
  function setST(t,c){ st.textContent=t; st.className=c||''; }

  // ==== VIDEO ====
  function streamURL(){ return `/stream?nocache=${Date.now()}`; }
  function startVideo(){ img.src = streamURL(); setST('Verbinden…','warn'); }

  img.addEventListener('load', ()=> setST('Verbunden','ok'));
  img.addEventListener('error',()=> { setST('Fehler','err'); setTimeout(startVideo,1500); });



// ==== AUDIO (ESP -> Tablet) - Low Latency PCM/WebAudio ====

let audioCtx = null;
let audioReader = null;
let audioRunning = false;
let nextPlayTime = 0;
let pendingByte = null;

async function startDoorAudio(){
  if (audioRunning) return;

  audioRunning = true;

  try {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)({
      sampleRate: 16000,
      latencyHint: "interactive"
    });

    await audioCtx.resume();

    const response = await fetch(
      `/audio.pcm?nocache=${Date.now()}`,
      { cache: "no-store" }
    );

    if (!response.ok || !response.body) {
      throw new Error(`PCM HTTP ${response.status}`);
    }

    audioReader = response.body.getReader();

    // Kleine Wiedergabereserve
    nextPlayTime = audioCtx.currentTime + 0.10;

    while (audioRunning) {
      const { value, done } = await audioReader.read();

      if (done || !value) break;

      let bytes = value;

      // Falls ein HTTP-Chunk mitten in einem 16-Bit-Sample endete:
      if (pendingByte !== null) {
        const joined = new Uint8Array(bytes.length + 1);
        joined[0] = pendingByte;
        joined.set(bytes, 1);
        bytes = joined;
        pendingByte = null;
      }

      if (bytes.length & 1) {
        pendingByte = bytes[bytes.length - 1];
        bytes = bytes.subarray(0, bytes.length - 1);
      }

      if (bytes.length === 0) continue;

      const sampleCount = bytes.length / 2;

      const buffer = audioCtx.createBuffer(
        1,
        sampleCount,
        16000
      );

      const channel = buffer.getChannelData(0);

      // PCM ist Signed 16 Bit Little Endian
      for (let i = 0; i < sampleCount; i++) {
        const lo = bytes[i * 2];
        const hi = bytes[i * 2 + 1];

        let sample = lo | (hi << 8);

        if (sample & 0x8000) {
          sample -= 0x10000;
        }

        channel[i] = sample / 32768.0;
      }

      const source = audioCtx.createBufferSource();
      source.buffer = buffer;
      source.connect(audioCtx.destination);

      // Falls wir hinter die Echtzeit geraten sind:
      // nicht immer weiter Versatz aufbauen.
      if (nextPlayTime < audioCtx.currentTime) {
        nextPlayTime = audioCtx.currentTime + 0.02;
      }

      source.start(nextPlayTime);

      nextPlayTime += sampleCount / 16000;
    }

  } catch(e) {
    if (audioRunning) {
      console.error("PCM audio failed:", e);
      setOV("Audiofehler");
    }
  }
}


async function stopDoorAudio(){
  audioRunning = false;
  pendingByte = null;

  if (audioReader) {
    try {
      await audioReader.cancel();
    } catch {}

    audioReader = null;
  }

  if (audioCtx) {
    try {
      await audioCtx.close();
    } catch {}

    audioCtx = null;
  }

  nextPlayTime = 0;
}
function setTalkUI(on){
  talking = on;

  if (on) {
    btnTalk.style.backgroundImage = "url('/auflegen.png')";
  } else {
    btnTalk.style.backgroundImage = "url('/sprechen.png')";
  }
}

  async function talkStart(){
    if (talking) return;
    setTalkUI(true);
    setOV("Audio an");

    // Server informieren (optional, aber sinnvoll)
    fetch(`/api/p${party}/talk/start`, {method:'POST'}).catch(()=>{});

    await startDoorAudio();
  }

  async function talkStop(){
    if (!talking) return;
    setTalkUI(false);
    setOV("Audio aus");

    stopDoorAudio();
    fetch(`/api/p${party}/talk/stop`, {method:'POST'}).catch(()=>{});
  }


// ==== GESPRÄCH EIN/AUS ====
btnTalk.addEventListener('click', async (e) => {
  e.preventDefault();

  if (talking) {
    await talkStop();
  } else {
    await talkStart();
  }
});






async function playRing(){
  try {
    const ring = new Audio(`${BASE}/Ring.mp3?nocache=${Date.now()}`);
    ring.volume = 1.0;
    await ring.play();
    setOV("Klingelton");
  } catch(e) {
    setOV("Ton blockiert");
    console.log("Ring autoplay blocked", e);
  }
}
  // ==== START ====
  setTalkUI(false);
  startVideo();
  playRing();
})();
async function waitAndReturn(){
  setTimeout(async () => {
    try{
      const r = await fetch("/api/state?nocache=" + Date.now());
      const s = await r.json();

      if (s.p1 === "idle") {
        window.location.href = "/idle.html";
      }
    }catch(e){}
  }, 30000);
}

//waitAndReturn();
</script>


</body>
</html>
